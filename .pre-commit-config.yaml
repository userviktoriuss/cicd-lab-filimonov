# Хуки запускаются автоматически при git commit (после `pre-commit install`).
# Быстрые проверки ДО того, как код попадёт в CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace   # хвостовые пробелы
      - id: end-of-file-fixer     # перевод строки в конце файла
      - id: check-yaml            # синтаксис YAML (workflow-файлы!)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                  # линтинг Python
        args: [--fix]
