name: CI
on: 
    push:
        branches:
            - main
    pull_request:
jobs:
    test:
        name: tests-job
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: 'pip'
            - name: Install requirements
              run: |
                pip install -r app/requirements.txt
            - name: Run tests
              run: |
                pytest app/tests -v
